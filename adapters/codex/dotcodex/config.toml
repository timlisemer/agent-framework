[mcp_servers.nixos-search]
command = "/run/current-system/sw/bin/docker"
args = [
  "exec",
  "-i",
  "mcp-toolbox",
  "sh",
  "-c",
  "exec 2>/dev/null; /app/tools/mcp-nixos/venv/bin/python3 -m mcp_nixos.server",
]

[mcp_servers.tailwind-svelte]
command = "/run/current-system/sw/bin/docker"
enabled = false
args = [
  "exec",
  "-i",
  "mcp-toolbox",
  "node",
  "/app/tools/tailwind-svelte-assistant/run.mjs",
]

[mcp_servers.context7]
command = "/run/current-system/sw/bin/docker"
enabled = false
args = ["exec", "-i", "mcp-toolbox", "npx", "-y", "@upstash/context7-mcp"]

[mcp_servers.agent-framework]
command = "/run/current-system/sw/bin/bash"
# Agent-framework owns per-tool active-work timeouts, so disable the host timeout.
tool_timeout_sec = 2147483647
args = [
  "-lc",
  "export AGENT_FRAMEWORK_ADAPTER=codex; exec node /mnt/docker-data/volumes/mcp-toolbox/agent-framework/dist/src/mcp/server.js",
]
